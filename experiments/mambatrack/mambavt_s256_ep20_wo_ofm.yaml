DATA: 
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 7
  TRAIN:
    DATASETS_NAME:
    - LasHeR_train
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 60000
  VAL:
    DATASETS_NAME:
    - LasHeR_val
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 10000

MODEL:
  # 使用你 50 轮训练好的 checkpoint 作为预训练权重
  PRETRAIN_FILE: "/media/data2/lms/MambaVT/pretrained_models/OSTrack_videomambas_ep300.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: videomamba_small_576
    STRIDE: 16
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

TRAIN:
  BACKBONE_MULTIPLIER: 0.05
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 4
  # 这里设置 finetune 的额外 epoch
  EPOCH: 22
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.00008   # finetune 时学习率建议稍微小一点
  LR_DROP_EPOCH: 10
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 100
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 5
  WEIGHT_DECAY: 0.0001
  AMP: False
  SAVE_EPOCH_INTERVAL: 5   # 1 表示每个 epoch 都存
  SAVE_LAST_N_EPOCH: 5

TEST:
  EPOCH: 22
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  TEMPLATE_NUMBER: 6
